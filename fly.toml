app = "scenic-route"
primary_region = "dfw"

[build]

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[http_service.http_options]
  idle_timeout = 300

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
