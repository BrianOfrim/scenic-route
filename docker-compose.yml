services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scenic
      POSTGRES_PASSWORD: scenic
      POSTGRES_DB: scenic_route
    ports:
      - "5432:5432"
    volumes:
      - scenic_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenic -d scenic_route"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  scenic_pg:
